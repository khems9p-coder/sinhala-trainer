<title>Sinhala Word Trainer · Lesson 1</title>
<meta name="theme-color" content="#0f5e6e">
<meta name="description" content="Learn commonly confused Sinhala words with Hindi and English meanings. Compiled by Hav Khem Bdr Chetry.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{--teal:#0f5e6e;--teal2:#14798c;--amber:#d98a1f;--green:#2f7d4f;--purple:#6b4fa0;--red:#c0392b;--bg:#f4f8f9;--card:#fff;--ink:#1f2a30;--mute:#5b6b71;--line:#dbe6e9}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter","Noto Sans Sinhala","Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
.si{font-family:"Noto Sans Sinhala",sans-serif}
.hi{font-family:"Noto Sans Devanagari",sans-serif}
header{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;padding:16px 16px 12px}
header h1{margin:0;font-size:20px}
header .sub{font-size:13px;opacity:.9}
header .by{font-size:12px;color:#ffd28a;margin-top:2px}
nav{display:flex;position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;background:none;padding:12px 4px;font:600 14px Inter,sans-serif;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--teal);border-bottom-color:var(--amber)}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
h2{font-size:18px;margin:0 0 8px;color:var(--teal)}
.word{font-size:22px;font-weight:700;color:var(--teal)}
.ro{font-style:italic;color:var(--mute);font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.tag.C{background:var(--green)}.tag.L{background:var(--purple)}.tag.B{background:var(--amber)}
.box{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.tip{background:#fff6e0;border-left:5px solid var(--amber)}
.warn{background:#fdecea;border-left:5px solid var(--red)}
.bridge{background:#e8f0fb;border-left:5px solid #2f5fa8}
.box b.t{display:block;font-size:12px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wrow{padding:10px 0;border-bottom:1px solid var(--line)}
.wrow:last-child{border:0}
/* flashcard */
.flash{perspective:1000px;height:300px;margin-bottom:12px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
.front{background:linear-gradient(160deg,var(--teal),var(--teal2));color:#fff}
.front .big{font-size:40px;font-weight:700}
.back{background:#fff;border:2px solid var(--amber);transform:rotateY(180deg)}
.back .big{font-size:22px;font-weight:700;color:var(--teal)}
.hint{font-size:12px;opacity:.75;margin-top:10px}
.btns{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:10px;padding:12px;font:600 15px Inter,sans-serif;cursor:pointer;background:var(--teal);color:#fff}
.btn.alt{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.btn.good{background:var(--green)}.btn.bad{background:var(--red)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 12px}
.prog div{height:100%;background:var(--amber);transition:width .3s}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;margin:6px 0;font-size:17px;cursor:pointer;font-family:inherit}
.opt.right{background:#e3f4e9;border-color:var(--green)}
.opt.wrong{background:#fdecea;border-color:var(--red)}
.q{font-size:18px;font-weight:600;margin-bottom:6px}
.expl{font-size:14px;margin-top:8px;padding:10px;border-radius:8px;background:#f5f9fa}
.score{font-size:42px;font-weight:700;color:var(--teal);text-align:center}
input[type=search]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin-bottom:10px;font-family:inherit}
.small{font-size:13px;color:var(--mute)}
.hl{color:var(--red)}
.ex{padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.ex .s{font-size:17px;font-weight:600}
footer{text-align:center;font-size:12px;color:var(--mute);padding:16px}
</style>
</head>

let st={known:{}};try{st=JSON.parse(localStorage.getItem("swt1"))||st}catch(e){}
function save(){try{localStorage.setItem("swt1",JSON.stringify(st))}catch(e){}}
const M=document.getElementById("main");
const esc=s=>s;
const tagname={C:"Colloquial",L:"Literary",B:"Both"};
function wrapSi(s){return s.replace(/([඀-෿‍]+(?:[\s඀-෿‍.,?!-]*[඀-෿‍]+)*)/g,"<span class='si'>$1</span>")}
let view="learn",gsel=0;
function chips(cb){return "<div class='chips'>"+["All",1,2,3,4,5].map((g,i)=>`<button class='chip ${gsel==i?"on":""}' data-g='${i}'>${i?"Group "+g:"All"}</button>`).join("")+"</div>"}
function bindChips(f){M.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{gsel=+b.dataset.g;f()})}

function learn(){
 const gs=gsel?GROUPS.filter(g=>g.id==gsel):GROUPS;
 M.innerHTML=chips()+gs.map(g=>`<div class='card'><div class='small'>GROUP ${g.id}</div><h2 class='si'>${g.title}</h2><div class='hi small'>${g.hindi}</div>
 <div class='box' style='background:#eaf6ee;border-left:5px solid var(--green)'><b class='t' style='color:var(--green)'>Rule</b>${wrapSi(g.rule)}</div>
 <div class='box bridge'><b class='t' style='color:#2f5fa8'>Hindi bridge</b>${g.bridge}</div>
 <div class='box tip'><b class='t' style='color:#a5650c'>Memory trick</b>${wrapSi(g.tip)}</div>
 <div class='box warn'><b class='t' style='color:var(--red)'>Common mistake</b>${g.mistake}</div>
 ${g.ex.map(e=>`<div class='ex'><div class='s si'>${e[0]}</div><div class='ro'>${e[1]}</div><div class='hi'>${e[2]}</div><div class='small'>${e[3]}</div></div>`).join("")}</div>`).join("");
 bindChips(learn);
}

let deck=[],di=0;
function buildDeck(){deck=WORDS.filter(w=>!gsel||w[0]==gsel).sort(()=>Math.random()-.5);di=0}
function cards(){
 if(!deck.length)buildDeck();
 if(di>=deck.length){const k=deck.filter(w=>st.known[w[1]]).length;
  M.innerHTML=chips()+`<div class='card' style='text-align:center'><div class='score'>${k} / ${deck.length}</div><p>words marked "I knew it"</p><div class='btns'><button class='btn' id='again'>Shuffle & start again</button></div></div>`;
  bindChips(()=>{buildDeck();cards()});document.getElementById("again").onclick=()=>{buildDeck();cards()};return}
 const w=deck[di];
 M.innerHTML=chips()+`<div class='small'>Card ${di+1} of ${deck.length} · tap the card to flip</div><div class='prog'><div style='width:${di/deck.length*100}%'></div></div>
 <div class='flash' id='fc'><div class='inner'>
  <div class='face front'><div class='big si'>${w[1]}</div><div style='margin-top:6px'><span class='tag ${w[5]}'>${tagname[w[5]]}</span></div><div class='hint'>What does it mean?</div></div>
  <div class='face back'><div class='big si'>${w[1]}</div><div class='ro'>${w[2]}</div><div class='hi' style='font-size:20px;margin-top:8px'>${w[3]}</div><div style='font-size:17px'>${w[4]}</div><div class='small' style='margin-top:6px'>Group ${w[0]}</div></div>
 </div></div>
 <div class='btns'><button class='btn bad' id='no'>Still learning</button><button class='btn good' id='yes'>I knew it</button></div>`;
 const fc=document.getElementById("fc");fc.onclick=()=>fc.classList.toggle("flip");
 document.getElementById("yes").onclick=()=>{st.known[w[1]]=1;save();di++;cards()};
 document.getElementById("no").onclick=()=>{delete st.known[w[1]];save();di++;cards()};
 bindChips(()=>{buildDeck();cards()});
}

let qs=[],qi=0,qscore=0,answered=false,missed=[];
function newQuiz(){qs=QUIZ.slice().sort(()=>Math.random()-.5).slice(0,10);qi=0;qscore=0;missed=[]}
function quiz(){
 if(!qs.length)newQuiz();
 if(qi>=qs.length){
  st.best=Math.max(st.best||0,qscore);save();
  M.innerHTML=`<div class='card' style='text-align:center'><div class='score'>${qscore} / ${qs.length}</div><p>${qscore>=9?"Excellent! Ready for Lesson 2.":qscore>=7?"Good — review the ones you missed.":"Go back to Learn, then try again."}</p><p class='small'>Best score: ${st.best} / 10</p><button class='btn' id='again'>New quiz</button></div>`+
  (missed.length?`<div class='card'><h2>Review</h2>${missed.map(m=>`<div class='ex'><div>${wrapSi(m[0])}</div><div><b>Answer:</b> <span class='si'>${m[1][m[2]]}</span></div><div class='small'>${wrapSi(m[3])}</div></div>`).join("")}</div>`:"");
  document.getElementById("again").onclick=()=>{newQuiz();quiz()};return}
 const q=qs[qi];answered=false;
 M.innerHTML=`<div class='small'>Question ${qi+1} of ${qs.length} · Score ${qscore}</div><div class='prog'><div style='width:${qi/qs.length*100}%'></div></div>
 <div class='card'><div class='q'>${wrapSi(q[0])}</div>${q[1].map((o,i)=>`<button class='opt si' data-i='${i}'>${o}</button>`).join("")}<div id='ex'></div></div>`;
 M.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  if(answered)return;answered=true;const i=+b.dataset.i;
  M.querySelectorAll(".opt")[q[2]].classList.add("right");
  if(i==q[2])qscore++;else{b.classList.add("wrong");missed.push(q)}
  document.getElementById("ex").innerHTML=`<div class='expl'>${i==q[2]?"✅ Correct! ":"❌ Not quite. "}${wrapSi(q[3])}</div><div class='btns' style='margin-top:10px'><button class='btn' id='nx'>${qi+1<qs.length?"Next":"See score"}</button></div>`;
  document.getElementById("nx").onclick=()=>{qi++;quiz()};
 });
}

let term="";
function words(){
 M.innerHTML=`<input type='search' id='s' placeholder='Search Sinhala, Roman, Hindi or English…' value='${term}'>`+chips()+"<div class='card' id='wl'></div>";
 const draw=()=>{const t=term.toLowerCase();
  const list=WORDS.filter(w=>(!gsel||w[0]==gsel)&&(!t||w.slice(1).join(" ").toLowerCase().includes(t)));
  document.getElementById("wl").innerHTML=list.length?list.map(w=>`<div class='wrow'><span class='word si'>${w[1]}</span><span class='tag ${w[5]}'>${tagname[w[5]]}</span>${st.known[w[1]]?" ✓":""}<div class='ro'>${w[2]}</div><div><span class='hi'>${w[3]}</span> · ${w[4]}</div></div>`).join(""):"<p class='small'>No match.</p>"};
 const s=document.getElementById("s");s.oninput=()=>{term=s.value;draw()};
 bindChips(words);draw();
}
const V={learn,cards,quiz,words};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x==b));
 view=b.dataset.v;if(view=="cards")buildDeck();if(view=="quiz")newQuiz();V[view]();window.scrollTo(0,0)});
learn();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
